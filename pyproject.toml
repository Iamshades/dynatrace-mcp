[project]
name = "dynatrace-mcp"
version = "0.1.0"
description = "Read-only-by-default MCP server for Dynatrace Managed and SaaS (classic API v2, API-token auth), built for Cursor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vishal Kumar" }]
keywords = ["dynatrace", "mcp", "cursor", "observability", "rca"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
# httpx and pydantic come with the MCP SDK; nothing else is needed at runtime.
dependencies = ["mcp>=1.10,<2"]

[project.scripts]
dynatrace-mcp = "dynatrace_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynatrace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
